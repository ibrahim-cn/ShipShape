services:
  db:
    image: postgres:16.4
    user: "999:999"
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app"]
    restart: unless-stopped
  api:
    image: registry.example.com/shipshape/api:1.4.0
    user: "10001:10001"
    privileged: false
    networks:
      - internal
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck"]
    restart: on-failure:3
  worker:
    image: registry.example.com/shipshape/worker:2.0.0
    user: "10002:10002"
    privileged: false
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/ready"]
    restart: unless-stopped
volumes:
  db-data:
networks:
  internal:
